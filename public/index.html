<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>findom therapy</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * { margin:0; padding:0; box-sizing:border-box; }
        body { font-family:'Inter',sans-serif; background:#0a0a0f; color:#fff; height:100vh; height:100dvh; display:flex; flex-direction:column; overflow:hidden; }

        /* Header */
        .chat-header {
            padding:16px 20px; display:flex; align-items:center; gap:14px;
            background:rgba(15,15,25,0.95); border-bottom:1px solid rgba(147,51,234,0.1);
            backdrop-filter:blur(20px); -webkit-backdrop-filter:blur(20px); flex-shrink:0; z-index:10;
        }
        .avatar { width:42px; height:42px; border-radius:50%; overflow:hidden; flex-shrink:0; border:2px solid rgba(147,51,234,0.3); }
        .avatar img { width:100%; height:100%; object-fit:cover; }
        .header-info h2 { font-size:16px; font-weight:600; color:#fff; }
        .header-sub { font-size:12px; color:rgba(147,51,234,0.6); }
        .header-status { font-size:11px; color:#22c55e; display:flex; align-items:center; gap:5px; margin-top:2px; }
        .header-status::before { content:''; width:6px; height:6px; border-radius:50%; background:#22c55e; }

        /* Chat area */
        .chat-area {
            flex:1; overflow-y:auto; padding:20px 16px; display:flex; flex-direction:column; gap:4px;
            scroll-behavior:smooth; -webkit-overflow-scrolling:touch;
        }
        .chat-area::-webkit-scrollbar { width:0; }

        /* Messages */
        .msg-row { display:flex; max-width:85%; animation:msgIn 0.3s ease; }
        .msg-row.therapist { align-self:flex-start; display:flex; align-items:flex-end; gap:8px; }
        .msg-avatar { width:28px; height:28px; border-radius:50%; overflow:hidden; flex-shrink:0; }
        .msg-avatar img { width:100%; height:100%; object-fit:cover; }
        .msg-row.patient { align-self:flex-end; }
        @keyframes msgIn { from{opacity:0;transform:translateY(8px)} to{opacity:1;transform:translateY(0)} }

        .bubble {
            padding:10px 14px; border-radius:18px; font-size:14.5px; line-height:1.55;
            word-wrap:break-word; position:relative;
        }
        .therapist .bubble {
            background:rgba(147,51,234,0.12); border:1px solid rgba(147,51,234,0.15);
            border-bottom-left-radius:4px; color:rgba(255,255,255,0.85);
        }
        .patient .bubble {
            background:#9333ea; border-bottom-right-radius:4px; color:#fff;
        }

        .msg-gap { height:12px; flex-shrink:0; }

        /* Typing indicator */
        .typing { display:flex; align-items:center; gap:4px; padding:12px 16px; align-self:flex-start; }
        .typing-dot {
            width:7px; height:7px; border-radius:50%; background:rgba(147,51,234,0.4);
            animation:typePulse 1.4s infinite;
        }
        .typing-dot:nth-child(2) { animation-delay:0.2s; }
        .typing-dot:nth-child(3) { animation-delay:0.4s; }
        @keyframes typePulse { 0%,60%,100%{opacity:0.3;transform:scale(1)} 30%{opacity:1;transform:scale(1.2)} }

        /* Response options */
        .options-tray {
            padding:12px 16px; display:flex; flex-direction:column; gap:8px;
            flex-shrink:0; background:rgba(10,10,15,0.95); border-top:1px solid rgba(147,51,234,0.08);
            backdrop-filter:blur(20px); -webkit-backdrop-filter:blur(20px);
            max-height:60vh; overflow-y:auto; animation:trayIn 0.3s ease;
        }
        @keyframes trayIn { from{opacity:0;transform:translateY(20px)} to{opacity:1;transform:translateY(0)} }

        .opt-btn {
            padding:12px 16px; border-radius:14px; font-size:14px; font-family:'Inter',sans-serif;
            cursor:pointer; transition:all 0.2s; text-align:left; display:flex; align-items:center; gap:10px;
            background:rgba(147,51,234,0.06); border:1px solid rgba(147,51,234,0.15); color:rgba(255,255,255,0.75);
        }
        .opt-btn:hover { background:rgba(147,51,234,0.15); border-color:rgba(147,51,234,0.3); color:#fff; transform:translateX(4px); }
        .opt-btn:active { transform:scale(0.98); }
        .opt-emoji { font-size:16px; flex-shrink:0; }

        /* Text input */
        .input-tray {
            padding:12px 16px; display:flex; gap:10px; align-items:center; flex-shrink:0;
            background:rgba(10,10,15,0.95); border-top:1px solid rgba(147,51,234,0.08);
            backdrop-filter:blur(20px); -webkit-backdrop-filter:blur(20px); animation:trayIn 0.3s ease;
        }
        .input-tray input {
            flex:1; padding:12px 16px; border-radius:22px; font-size:15px; font-family:'Inter',sans-serif;
            background:rgba(255,255,255,0.06); border:1px solid rgba(147,51,234,0.15); color:#fff; outline:none;
        }
        .input-tray input:focus { border-color:rgba(147,51,234,0.4); }
        .input-tray input::placeholder { color:rgba(255,255,255,0.25); }
        .send-btn {
            width:42px; height:42px; border-radius:50%; border:none; cursor:pointer; flex-shrink:0;
            background:linear-gradient(135deg,#9333ea,#c084fc); color:#fff; font-size:18px;
            display:flex; align-items:center; justify-content:center; transition:transform 0.2s;
        }
        .send-btn:hover { transform:scale(1.05); }

        /* Landing overlay */
        .landing {
            position:fixed; inset:0; background:#0a0a0f; z-index:100;
            display:flex; flex-direction:column; align-items:center; justify-content:center;
            padding:30px; text-align:center; animation:fadeIn 0.5s ease;
        }
        @keyframes fadeIn { from{opacity:0} to{opacity:1} }
        .landing.hidden { display:none; }
        .landing-icon { font-size:64px; margin-bottom:20px; }
        .landing h1 {
            font-size:28px; font-weight:700;
            background:linear-gradient(135deg,#9333ea,#c084fc); -webkit-background-clip:text;
            -webkit-text-fill-color:transparent; background-clip:text; margin-bottom:8px;
        }
        .landing .sub { font-size:14px; color:rgba(255,255,255,0.35); line-height:1.6; margin-bottom:32px; }
        .landing .start-btn {
            padding:16px 48px; border-radius:14px; border:none; font-family:'Inter',sans-serif;
            font-size:16px; font-weight:600; cursor:pointer;
            background:linear-gradient(135deg,#9333ea,#c084fc); color:#fff;
            box-shadow:0 4px 30px rgba(147,51,234,0.3); transition:all 0.3s;
        }
        .landing .start-btn:hover { transform:translateY(-2px); box-shadow:0 6px 40px rgba(147,51,234,0.4); }
        .landing .fine { font-size:11px; color:rgba(255,255,255,0.12); margin-top:24px; }

        /* Results card */
        .results-card {
            align-self:flex-start; max-width:90%; background:rgba(147,51,234,0.06);
            border:1px solid rgba(147,51,234,0.15); border-radius:16px; padding:20px;
            margin:8px 0; animation:msgIn 0.5s ease;
        }
        .results-score {
            font-family:'JetBrains Mono',monospace; font-size:48px; font-weight:700;
            color:#9333ea; text-align:center; margin:8px 0;
        }
        .results-label { font-size:18px; font-weight:600; color:#c084fc; text-align:center; margin-bottom:8px; }
        .results-bar { width:100%; height:8px; background:rgba(255,255,255,0.05); border-radius:4px; overflow:hidden; margin:12px 0; }
        .results-bar-fill { height:100%; border-radius:4px; background:linear-gradient(90deg,#c084fc,#9333ea,#7c3aed); transition:width 1.5s ease; }
        .results-text { font-size:13px; color:rgba(255,255,255,0.4); line-height:1.7; text-align:center; }

        /* CTA button in chat */
        .cta-row { align-self:flex-start; max-width:85%; animation:msgIn 0.3s ease; margin:4px 0; }
        .cta-btn {
            display:block; padding:14px 24px; border-radius:14px; font-family:'Inter',sans-serif;
            font-size:15px; font-weight:600; text-decoration:none; text-align:center;
            background:linear-gradient(135deg,#9333ea,#c084fc); color:#fff;
            box-shadow:0 4px 20px rgba(147,51,234,0.3); transition:all 0.3s;
        }
        .cta-btn:hover { transform:translateY(-2px); box-shadow:0 6px 30px rgba(147,51,234,0.4); }
    </style>
</head>
<body>

<!-- Landing -->
<div class="landing" id="landing">
    <div style="width:90px; height:90px; border-radius:50%; overflow:hidden; border:3px solid rgba(147,51,234,0.3); margin-bottom:8px;"><img src="/pfp.jpg" style="width:100%;height:100%;object-fit:cover;" alt=""></div>
    <h1>findom therapy</h1>
    <p class="sub">treating addictions ur real therapist<br>will never know about ~</p>
    <button class="start-btn" onclick="startSession()">start ur session 💜</button>
    <p class="fine">everything said here stays here ~ 🤭</p>
</div>

<!-- Chat -->
<div class="chat-header">
    <div class="avatar"><img src="/pfp.jpg" alt=""></div>
    <div class="header-info">
        <h2>findom therapy</h2>
        <div class="header-sub">@therapy4addict</div>
        <div class="header-status">in session</div>
    </div>
</div>

<div class="chat-area" id="chat"></div>
<div id="bottom-tray"></div>

<script>
const chat = document.getElementById('chat');
const tray = document.getElementById('bottom-tray');
let username = '';
let answers = {};
let totalScore = 0;

// Conversation script
const script = [
    // 0: ask username
    { therapist:["hiii 💞","welcome to findom therapyy","before we start our first therapy session i need to ask you a couple questions ~","let's start with ur twitter username <3"], input:'text', placeholder:'@username' },
    // 1: how long
    { therapist:["perfect ~ nice to meet you, i'm Mikayla <3","how long have u had this addiction for? 💞"], options:[
        { text:"a few weeks", score:1, key:"duration" },
        { text:"a few months", score:2, key:"duration" },
        { text:"over a year", score:3, key:"duration" },
        { text:"i don't even remember when it started", score:4, key:"duration" }
    ]},
    // 2: how much sent
    { therapist:["omg that's terrible 😣","don't worry i can helpp <3","how much would u say u've spent on findom?"], options:[
        { text:"less than $100", score:1, key:"spent" },
        { text:"$100 - $500", score:2, key:"spent" },
        { text:"$500 - $2,000", score:3, key:"spent" },
        { text:"$2,000+", score:4, key:"spent" }
    ]},
    // 3: dom style
    { therapist:["omg 😣 that's a lot of money wasted ~","what dom style triggers u the most?"], options:[
        { text:"humiliation ~ being degraded makes me send harder", score:1, key:"style" },
        { text:"parasocial ~ i genuinely think she cares about me", score:1, key:"style" },
        { text:"financial domination ~ watching my balance drop gets me off", score:1, key:"style" },
        { text:"blackmail fantasy ~ \"imagine if someone found out\"", score:1, key:"style" },
        { text:"manscam ~ i know she's fake but i don't care", score:1, key:"style" }
    ]},
    // 4: triggers / models (free text)
    { therapist:["okay last one ~","are there any specific models or triggers that make u relapse?","anything u type here stays between us ~"], input:'textarea', placeholder:'type here ~' }
];

const diagnoses = [
    { min:0, max:3, label:"early stage", response:["okay ~","u're not deep yet ~ but u're here for a reason 🤭","let's keep an eye on this ~"] },
    { min:4, max:6, label:"developing dependency", response:["hmm ~","u're past the 'i can stop whenever' stage ~","the patterns are forming ~ u need sessions before this takes over ~"] },
    { min:7, max:9, label:"active addiction", response:["okay ~","u already knew what i was going to say didn't u 🤭","ur brain has rewired itself around this ~ u need help ~"] },
    { min:10, max:12, label:"severe addiction", response:["i need u to hear this ~","u are in crisis ~ this has taken over ur life ~","dm me ~ let's start real treatment 💜"] }
];


function startSession() {
    document.getElementById('landing').classList.add('hidden');
    runStep(0);
}

function scrollDown() {
    setTimeout(() => { chat.scrollTop = chat.scrollHeight; }, 50);
}

function addGap() {
    const g = document.createElement('div');
    g.className = 'msg-gap';
    chat.appendChild(g);
}

function addTherapistMsg(text) {
    return new Promise(resolve => {
        // Show typing
        const typing = document.createElement('div');
        typing.className = 'typing';
        typing.innerHTML = '<div class="typing-dot"></div><div class="typing-dot"></div><div class="typing-dot"></div>';
        chat.appendChild(typing);
        scrollDown();

        const delay = Math.min(600 + text.length * 20, 1800);
        setTimeout(() => {
            chat.removeChild(typing);
            const row = document.createElement('div');
            row.className = 'msg-row therapist';
            const av = document.createElement('div');
            av.className = 'msg-avatar';
            av.innerHTML = '<img src="/pfp.jpg" alt="">';
            row.appendChild(av);
            const bubble = document.createElement('div');
            bubble.className = 'bubble';
            bubble.textContent = text.replace('{name}', username);
            row.appendChild(bubble);
            chat.appendChild(row);
            scrollDown();
            resolve();
        }, delay);
    });
}

function addPatientMsg(text) {
    const row = document.createElement('div');
    row.className = 'msg-row patient';
    const bubble = document.createElement('div');
    bubble.className = 'bubble';
    bubble.textContent = text;
    row.appendChild(bubble);
    chat.appendChild(row);
    scrollDown();
}

async function sendTherapistMessages(messages) {
    for (let i = 0; i < messages.length; i++) {
        await addTherapistMsg(messages[i]);
    }
}

function showOptions(options) {
    tray.innerHTML = '';
    const optTray = document.createElement('div');
    optTray.className = 'options-tray';
    options.forEach(opt => {
        const btn = document.createElement('button');
        btn.className = 'opt-btn';
        btn.innerHTML = opt.emoji ? `<span class="opt-emoji">${opt.emoji}</span>${opt.text}` : opt.text;
        btn.onclick = () => selectOption(opt);
        optTray.appendChild(btn);
    });
    tray.appendChild(optTray);
    scrollDown();
}

function showTextInput(placeholder) {
    tray.innerHTML = '';
    const inputTray = document.createElement('div');
    inputTray.className = 'input-tray';
    const input = document.createElement('input');
    input.type = 'text';
    input.placeholder = placeholder;
    input.id = 'user-input';
    const sendBtn = document.createElement('button');
    sendBtn.className = 'send-btn';
    sendBtn.textContent = '→';
    const submit = () => {
        const val = input.value.trim();
        if (!val) return;
        username = val;
        addPatientMsg(val);
        tray.innerHTML = '';
        addGap();
        runStep(currentStep + 1);
    };
    sendBtn.onclick = submit;
    input.onkeydown = (e) => { if (e.key === 'Enter') submit(); };
    inputTray.appendChild(input);
    inputTray.appendChild(sendBtn);
    tray.appendChild(inputTray);
    setTimeout(() => input.focus(), 300);
    scrollDown();
}

function showTextArea(placeholder) {
    tray.innerHTML = '';
    const inputTray = document.createElement('div');
    inputTray.className = 'input-tray';
    inputTray.style.alignItems = 'flex-end';
    const ta = document.createElement('textarea');
    ta.placeholder = placeholder;
    ta.rows = 3;
    ta.style.cssText = 'flex:1;padding:12px 16px;border-radius:16px;font-size:15px;font-family:Inter,sans-serif;background:rgba(255,255,255,0.06);border:1px solid rgba(147,51,234,0.15);color:#fff;outline:none;resize:none;';
    const sendBtn = document.createElement('button');
    sendBtn.className = 'send-btn';
    sendBtn.textContent = '→';
    const submit = () => {
        const val = ta.value.trim();
        if (!val) return;
        answers['triggers'] = val;
        addPatientMsg(val);
        tray.innerHTML = '';
        addGap();
        const next = currentStep + 1;
        if (next < script.length) { runStep(next); } else { showResults(); }
    };
    sendBtn.onclick = submit;
    inputTray.appendChild(ta);
    inputTray.appendChild(sendBtn);
    tray.appendChild(inputTray);
    setTimeout(() => ta.focus(), 300);
    scrollDown();
}

let currentStep = 0;

async function runStep(step) {
    currentStep = step;
    const s = script[step];
    if (!s) { showResults(); return; }

    await sendTherapistMessages(s.therapist);
    addGap();

    if (s.input === 'text') {
        showTextInput(s.placeholder);
    } else if (s.input === 'textarea') {
        showTextArea(s.placeholder);
    } else if (s.options) {
        showOptions(s.options);
    }
}

async function selectOption(opt) {
    addPatientMsg(opt.text);
    tray.innerHTML = '';
    addGap();

    totalScore += opt.score;
    if (opt.key) answers[opt.key] = opt.text;

    // next step
    const next = currentStep + 1;
    if (next < script.length) {
        runStep(next);
    } else {
        showResults();
    }
}

async function showResults() {
    const diag = diagnoses.find(d => totalScore >= d.min && totalScore <= d.max) || diagnoses[diagnoses.length - 1];

    // Send to backend (→ Telegram)
    const answersText = Object.entries(answers).map(([k,v]) => `${k}: ${v}`).join('\n');
    fetch('/api/quiz-result', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
            username: username,
            score: totalScore + '/12',
            level: diag.label,
            answers: answersText
        })
    }).catch(() => {});

    addGap();

    // Therapist delivers diagnosis messages
    await sendTherapistMessages(diag.response);
    addGap();

    // Score card
    const displayScore = Math.round((totalScore / 12) * 10 * 10) / 10;
    const card = document.createElement('div');
    card.className = 'results-card';
    card.innerHTML = `
        <div style="font-size:11px; color:rgba(147,51,234,0.5); text-transform:uppercase; letter-spacing:2px; text-align:center; margin-bottom:8px;">session assessment</div>
        <div class="results-score">${displayScore % 1 === 0 ? displayScore.toFixed(0) : displayScore.toFixed(1)}<span style="font-size:20px;color:rgba(255,255,255,0.2);">/10</span></div>
        <div class="results-bar"><div class="results-bar-fill" id="res-bar-fill" style="width:0%"></div></div>
        <div class="results-label">${diag.label}</div>
    `;
    chat.appendChild(card);
    scrollDown();

    setTimeout(() => {
        document.getElementById('res-bar-fill').style.width = (displayScore / 10 * 100) + '%';
    }, 200);

    // Wait then send CTA
    await new Promise(r => setTimeout(r, 1500));

    await addTherapistMsg("ur session summary is ready ~");
    await addTherapistMsg("if u want to keep going ~ u know where to find me 💜");
    addGap();

    // CTA button
    const ctaRow = document.createElement('div');
    ctaRow.className = 'cta-row';
    ctaRow.innerHTML = `<a class="cta-btn" href="https://x.com/therapy4addict" target="_blank">dm @therapy4addict on twitter 💜</a>`;
    chat.appendChild(ctaRow);
    scrollDown();
    scrollDown();
}
</script>
</body>
</html>
